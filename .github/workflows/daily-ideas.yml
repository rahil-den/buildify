name: Daily ideas

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC; ideas are made a day ahead so every time zone is covered
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write today's and tomorrow's entries for every page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEA_MODEL: ${{ vars.IDEA_MODEL }}
        run: node scripts/daily-ideas.mjs
      - name: Check the data files
        run: node scripts/validate.mjs
      - name: Commit
        id: commit
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily ideas for $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
