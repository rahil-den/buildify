name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # the daily and submission workflows call this after they commit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always publish the newest commit, including one pushed seconds ago
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the data files
        run: node scripts/validate.mjs
      - name: Collect the site files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets data _site/
          node scripts/embed-data.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
